<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Austin's Chores ⭐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff7e6; --card:#ffffff; --blue:#2f7df6; --blue-dark:#1b4fa0;
    --gold:#ffb703; --green:#2ec76f; --pink:#ff6b9d; --ink:#21304a; --muted:#7a879c;
    --shadow:0 8px 24px rgba(33,48,74,.12); --radius:28px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Fredoka',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:16px 14px 32px;user-select:none}
  .wrap{max-width:760px;margin:0 auto}

  /* Header */
  header{text-align:center;padding:10px 0 4px}
  .dogs{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
  .dogs img{width:74px;height:74px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:var(--shadow)}
  h1{font-size:44px;font-weight:700;margin:0;line-height:1.05}
  .hi-sub{font-size:20px;color:var(--muted);font-weight:600;margin-top:4px}

  .stars{text-align:center;font-size:22px;font-weight:700;color:#d18d00;background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:12px 18px;margin:16px auto 6px;max-width:340px}

  /* Sections */
  h2{font-size:32px;font-weight:700;margin:26px 4px 4px}
  .hint{font-size:18px;color:var(--muted);font-weight:600;margin:0 4px 12px}
  .group{font-size:22px;font-weight:700;margin:16px 4px 10px;color:var(--blue-dark)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}

  /* Big tap tiles */
  .tile{border:4px solid #e8eef7;background:var(--card);border-radius:24px;min-height:132px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:inherit;width:100%;position:relative;transition:transform .15s ease,background .2s}
  .tile:active{transform:scale(.96)}
  .tile .pic{font-size:62px;line-height:1}
  .tile .pic img{width:62px;height:62px;border-radius:50%;object-fit:cover;display:block}
  .tile .name{font-size:21px;font-weight:600;line-height:1.15;text-align:center}
  .tile.done{background:#d9f7e6;border-color:var(--green)}
  .tile.done::after{content:'✓';position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}

  .big-banner{display:none;background:#d9f7e6;border:4px solid var(--green);color:#146c39;border-radius:24px;padding:18px;text-align:center;font-size:26px;font-weight:700;margin:14px 0}
  .big-banner.show{display:block}

  .footer{text-align:center;color:var(--muted);font-size:14px;font-weight:600;padding:22px 0 4px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
  .dot.off{background:var(--gold)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--blue-dark);color:#fff;font-size:22px;font-weight:700;padding:14px 26px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:50;box-shadow:var(--shadow);white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
  .burst{position:fixed;font-size:34px;pointer-events:none;z-index:60;animation:fly 1s ease-out forwards}
  @keyframes fly{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-110px) scale(1.4)}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="dogs"><img id="pet1" alt="Spot"><img id="pet2" alt="Pedro"></div>
    <h1>Hi Austin! 👋</h1>
    <div class="hi-sub">Tap a picture when you're done!</div>
  </header>

  <div class="stars" id="todayStars">⭐ 0 jobs done today</div>

  <h2>☀️ Today</h2>
  <p class="hint">Do these every day.</p>
  <div class="big-banner" id="allDone">🎉 You did everything today! Great job, Austin! 🎉</div>

  <div class="group">🌅 Morning</div>
  <div class="grid" id="morningGrid"></div>
  <div class="group">🌞 Day</div>
  <div class="grid" id="daytimeGrid"></div>
  <div class="group">🌙 Night</div>
  <div class="grid" id="eveningGrid"></div>

  <div class="footer"><span class="dot" id="dot"></span><span id="sync">Loading…</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===== Same backend and chore IDs as the original chart — only the screen changed =====
  const CONFIG = {
    kid: 'austin',
    supabaseUrl: 'https://gpumiccbztdqsszqplhf.supabase.co',
    supabaseAnonKey: 'sb_publishable_y_qNcwejAfm2Ewexz_KsOQ_3JWX7AuM'
  };

  const MORNING = [
    { id: 'morning-bathroom',  name: 'Use the bathroom', label: 'Bathroom', icon: '🚽' },
    { id: 'morning-brush',     name: 'Brush teeth', icon: '🪥' },
    { id: 'morning-prayers',   name: 'Morning prayers', label: 'Prayers', icon: '🙏' },
    { id: 'morning-dressed',   name: 'Get dressed', icon: '👕' },
    { id: 'morning-breakfast', name: 'Eat breakfast', label: 'Breakfast', icon: '🥞' },
    { id: 'morning-scripture', name: 'Read scriptures', label: 'Scriptures', icon: '📖' },
    { id: 'morning-hair',      name: 'Do hair',     icon: '💇' },
    { id: 'morning-exercise',  name: 'Exercise',    icon: '🏃' },
    { id: 'morning-bed',       name: 'Make bed',    icon: '🛏️' },
    { id: 'morning-room',      name: 'Clean room',  icon: '🧸' }
  ];
  const DAYTIME = [
    { id: 'daytime-lunch',        name: 'Eat lunch', label: 'Lunch', icon: '🍎' },
    { id: 'daytime-walk-spot',    name: 'Walk Spot (15 min)', label: 'Walk Spot', photo: './photos/spot-2.jpg' },
    { id: 'daytime-walk-pedro',   name: 'Walk Pedro (15 min)', label: 'Walk Pedro', photo: './photos/pedro-3.jpg' },
    { id: 'daytime-feed-spot',    name: 'Feed Spot',       photo: './photos/spot-1.jpg' },
    { id: 'daytime-dishes',       name: 'Put away clean dishes', label: 'Put dishes away', icon: '🍽️' },
    { id: 'daytime-clear-dinner', name: 'Clear dishes from dinner', label: 'Clear dinner', icon: '🍴' }
  ];
  const EVENING = [
    { id: 'evening-brush',   name: 'Brush teeth', icon: '🪥' },
    { id: 'evening-bath',    name: 'Bath time', label: 'Bath', icon: '🛁' },
    { id: 'evening-prayers', name: 'Prayers', label: 'Prayers', icon: '🙏' }
  ];
  const ALL_ROUTINES = [...MORNING, ...DAYTIME, ...EVENING];

  const SPOT=['./photos/spot-1.jpg','./photos/spot-2.jpg','./photos/spot-3.jpg','./photos/spot-4.jpg'];
  const PEDRO=['./photos/pedro-1.jpg','./photos/pedro-2.jpg','./photos/pedro-3.jpg'];

  // ===== Supabase (unchanged) =====
  const SB = CONFIG.supabaseUrl + '/rest/v1';
  const AUTH = { apikey: CONFIG.supabaseAnonKey, Authorization: 'Bearer ' + CONFIG.supabaseAnonKey };
  async function sbGet(p){ const r=await fetch(SB+'/'+p,{headers:AUTH}); if(!r.ok) throw new Error(r.status); return r.json(); }
  async function sbPost(p,b){ const r=await fetch(SB+'/'+p,{method:'POST',headers:{...AUTH,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(b)}); if(!r.ok) throw new Error(r.status); const d=await r.json(); return Array.isArray(d)?d[0]:d; }
  async function sbDelete(p){ const r=await fetch(SB+'/'+p,{method:'DELETE',headers:AUTH}); if(!r.ok) throw new Error(r.status); }

  // Day rolls over at 10pm (unchanged)
  function isoDate(d){ const s=new Date(d.getTime()+2*3600*1000); return s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')+'-'+String(s.getDate()).padStart(2,'0'); }

  let todayKey = isoDate(new Date()), todayLog=[], allLog=[], ready=false;

  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1900); }
  function burst(x,y){ ['⭐','🎉','💙'].forEach((e,i)=>{ const s=document.createElement('span'); s.className='burst'; s.textContent=e; s.style.left=(x-16+i*30)+'px'; s.style.top=(y-20)+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }); }
  function setSync(ok,txt){ document.getElementById('dot').classList.toggle('off',!ok); document.getElementById('sync').textContent=txt; }

  function tile(picHTML,name){
    const b=document.createElement('button'); b.type='button'; b.className='tile';
    b.innerHTML = '<div class="pic">'+picHTML+'</div><div class="name">'+name+'</div>';
    return b;
  }
  const picFor = c => c.photo ? '<img src="'+c.photo+'" alt="">' : (c.icon||'⭐');

  function renderRoutines(){
    [['morningGrid',MORNING],['daytimeGrid',DAYTIME],['eveningGrid',EVENING]].forEach(([gid,list])=>{
      const g=document.getElementById(gid); g.innerHTML='';
      list.forEach(c=>{ const b=tile(picFor(c),c.label||c.name); b.dataset.id=c.id; b.addEventListener('click',ev=>toggleRoutine(c,ev)); g.appendChild(b); });
    });
  }
  function refreshUI(){
    const routineDone = id => todayLog.some(r=>r.is_baseline && r.chore_id===id);
    ALL_ROUTINES.forEach(c=>{ const el=document.querySelector('.tile[data-id="'+c.id+'"]'); if(el){ const d=routineDone(c.id); el.classList.toggle('done',d); el.setAttribute('aria-pressed',d); }});
    const doneCount = ALL_ROUTINES.filter(c=>routineDone(c.id)).length;
    document.getElementById('allDone').classList.toggle('show', doneCount===ALL_ROUTINES.length);

    const jobsToday = doneCount;
    document.getElementById('todayStars').textContent = '⭐ '+jobsToday+(jobsToday===1?' job':' jobs')+' done today';
  }

  async function toggleRoutine(c,ev){
    if(!ready){ toast('One second… ⏳'); return; }
    const ex=todayLog.find(r=>r.chore_id===c.id && r.is_baseline);
    try{
      if(ex){ await sbDelete('chore_log?id=eq.'+ex.id); todayLog=todayLog.filter(r=>r.id!==ex.id); allLog=allLog.filter(r=>r.id!==ex.id); toast('Okay, undone'); }
      else{ const d=await sbPost('chore_log',{kid:CONFIG.kid,log_date:todayKey,chore_id:c.id,chore_name:c.name,is_baseline:true,minutes:0}); todayLog.push(d); allLog.push(d); toast('Great job! ⭐'); if(ev) burst(ev.clientX,ev.clientY); }
    }catch(e){ toast('Oops — try again 😢'); return; }
    refreshUI();
  }
  async function fetchAll(){
    allLog = await sbGet('chore_log?select=*&kid=eq.'+CONFIG.kid+'&order=completed_at.asc');
    todayLog = allLog.filter(r=>r.log_date===todayKey);
  }
  async function init(){
    try{
      await fetchAll(); refreshUI(); ready=true; setSync(true,'All saved ✓');
      setInterval(async()=>{ try{ await fetchAll(); refreshUI(); setSync(true,'All saved ✓'); }catch(e){ setSync(false,'Saving later…'); } },5000);
    }catch(e){ setSync(false,'No internet — try again'); }
  }
  setInterval(()=>{ const k=isoDate(new Date()); if(k!==todayKey){ todayKey=k; todayLog=allLog.filter(r=>r.log_date===todayKey); refreshUI(); } },60000);

  document.getElementById('pet1').src = SPOT[Math.floor(Math.random()*SPOT.length)];
  document.getElementById('pet2').src = PEDRO[Math.floor(Math.random()*PEDRO.length)];
  renderRoutines(); init();
</script>
</body>
</html>
